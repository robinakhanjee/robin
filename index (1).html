<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Billing - Referral Manager</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;600;700&display=swap');

    :root {
      --bg: #F0F4FF;
      --surface: #FFFFFF;
      --primary: #2C5BF0;
      --primary-dk: #1A3FBF;
      --accent: #00C2A0;
      --text: #1A1D2E;
      --muted: #6B7280;
      --border: #D8DEFF;
      --error: #E53E3E;
      --success: #00C2A0;
      --shadow: 0 4px 24px rgba(44, 91, 240, .10);
      --radius: 14px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 60px;
    }

    .page-header { text-align: center; margin-bottom: 36px; max-width: 600px; }
    .page-header .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(44,91,240,.10); color: var(--primary);
      font-size: 12px; font-weight: 600; letter-spacing: .06em;
      text-transform: uppercase; padding: 5px 14px; border-radius: 20px; margin-bottom: 16px;
    }
    .page-header h1 { font-family: 'Sora', sans-serif; font-size: clamp(26px, 5vw, 40px); font-weight: 700; color: var(--text); }
    .page-header p { margin-top: 10px; color: var(--muted); font-size: 15px; line-height: 1.6; }

    .card {
      background: var(--surface); border-radius: var(--radius);
      box-shadow: var(--shadow); width: 100%; max-width: 760px;
      padding: 40px 44px; border: 1px solid var(--border);
    }

    .section-label {
      font-family: 'Sora', sans-serif; font-size: 11px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase; color: var(--primary);
      border-bottom: 2px solid var(--border); padding-bottom: 8px; margin: 32px 0 20px;
    }
    .section-label:first-of-type { margin-top: 0; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; }
    .col-span-2 { grid-column: span 2; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 13px; font-weight: 500; color: var(--text); display: flex; align-items: center; gap: 4px; }
    label .req { color: var(--primary); }

    input, select {
      width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
      border-radius: 9px; font-size: 14px; font-family: 'Inter', sans-serif;
      color: var(--text); background: #FAFBFF; transition: border-color .18s, box-shadow .18s; outline: none;
    }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(44,91,240,.12); background: #fff; }
    input.error, select.error { border-color: var(--error); box-shadow: 0 0 0 3px rgba(229,62,62,.10); }
    input::placeholder { color: #B0B7C3; }
    .field-hint { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

    .refer-wrap { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .refer-wrap select { flex: 1 1 200px; }
    .btn-outline {
      background: transparent; border: 1.5px solid var(--primary); color: var(--primary);
      padding: 10px 16px; border-radius: 9px; font-weight: 600; font-size: 13px;
      cursor: pointer; transition: background .15s, color .15s; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-outline:hover { background: rgba(44,91,240,.08); }
    .btn-outline:active { background: rgba(44,91,240,.15); }

    /* Submit */
    .submit-wrap { margin-top: 32px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    button[type="submit"] {
      flex: 1; min-width: 200px; padding: 15px 32px; background: var(--primary);
      color: #fff; font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 600;
      border: none; border-radius: 10px; cursor: pointer; transition: background .18s, transform .12s, box-shadow .18s;
      letter-spacing: .02em; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    button[type="submit"]:hover:not(:disabled) { background: var(--primary-dk); box-shadow: 0 6px 20px rgba(44,91,240,.30); transform: translateY(-1px); }
    button[type="submit"]:active:not(:disabled) { transform: translateY(0); }
    button[type="submit"]:disabled { opacity: .6; cursor: not-allowed; }

    .reset-btn { padding: 14px 24px; background: transparent; border: 1.5px solid var(--border); border-radius: 10px; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; transition: border-color .18s, color .18s; }
    .reset-btn:hover { border-color: var(--primary); color: var(--primary); }

    #feedback {
      display: none; border-radius: 10px; padding: 14px 20px; font-size: 14px;
      font-weight: 500; margin-top: 20px; align-items: center; gap: 10px;
    }
    #feedback.show { display: flex; }
    #feedback.success { background: rgba(0,194,160,.10); color: #00856F; border: 1.5px solid rgba(0,194,160,.30); }
    #feedback.fail { background: rgba(229,62,62,.08); color: var(--error); border: 1.5px solid rgba(229,62,62,.20); }

    .spinner {
      width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.4);
      border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; display: none;
    }
    button[type="submit"].loading .spinner { display: block; }
    button[type="submit"].loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer { margin-top: 32px; font-size: 12px; color: var(--muted); text-align: center; }
    footer a { color: var(--primary); text-decoration: none; }

    @media (max-width: 560px) {
      .card { padding: 28px 20px; }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .col-span-2 { grid-column: span 1; }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="badge">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M6 3.5V6.5L7.5 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Patient Billing System
    </div>
    <h1>Billing Record Entry</h1>
    <p>Fill in the details below. Every submission is saved directly to Google Sheets.</p>
  </header>

  <div class="card">
    <form id="billingForm" novalidate>
      <!-- PATIENT INFO -->
      <div class="section-label">Patient Information</div>
      <div class="grid-2">
        <div class="field">
          <label for="patientName">Patient Name <span class="req">*</span></label>
          <input type="text" id="patientName" name="patientName" placeholder="Full name" required />
        </div>
        <div class="field">
          <label for="patientPhone">Phone Number <span class="req">*</span></label>
          <input type="tel" id="patientPhone" name="patientPhone" placeholder="+880 1XXX-XXXXXX" required />
        </div>
        <div class="field">
          <label for="location">Location</label>
          <input type="text" id="location" name="location" placeholder="City / Area" />
        </div>
        <div class="field">
          <label for="serial">Serial</label>
          <input type="text" id="serial" name="serial" placeholder="e.g. SN-001" />
        </div>
      </div>

      <!-- BILLING DETAILS -->
      <div class="section-label">Billing Details</div>
      <div class="grid-3">
        <div class="field">
          <label for="payment">Payment <span class="req">*</span></label>
          <input type="text" id="payment" name="payment" placeholder="Amount or status" required />
        </div>
        <div class="field">
          <label for="billAmount">Bill Received Amount <span class="req">*</span></label>
          <input type="number" id="billAmount" name="billAmount" placeholder="0.00" min="0" step="0.01" required />
        </div>
        <div class="field">
          <label for="billDue">Bill Received Due</label>
          <input type="number" id="billDue" name="billDue" placeholder="0.00" min="0" step="0.01" />
        </div>
        <div class="field col-span-2">
          <label for="billDate">Bill Received Date <span class="req">*</span></label>
          <input type="date" id="billDate" name="billDate" required />
        </div>
      </div>

      <!-- REFERRAL & MATCH -->
      <div class="section-label">Referral &amp; Match</div>
      <div class="grid-2">
        <div class="field col-span-2">
          <label for="refer">Referral Name <span class="req">*</span></label>
          <div class="refer-wrap">
            <select id="refer" name="refer" required></select>
          </div>
          <div class="field-hint">Referral names are loaded automatically from the server.</div>
        </div>
        <div class="field">
          <label for="matchPersonName">Match Person Name</label>
          <input type="text" id="matchPersonName" name="matchPersonName" placeholder="Matched contact" />
        </div>
        <div class="field">
          <label for="totalMatch">Total Match</label>
          <input type="text" id="totalMatch" name="totalMatch" placeholder="e.g. 3 / Full" />
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="submit-wrap">
        <button type="submit" id="submitBtn">
          <span class="btn-text">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="vertical-align:middle;margin-right:4px"><path d="M2 8h12M9 4l5 4-5 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Save to Google Sheets
          </span>
          <span class="spinner"></span>
        </button>
        <button type="button" class="reset-btn" onclick="resetForm()">Clear Form</button>
      </div>
      <div id="feedback" role="alert"></div>
    </form>
  </div>

  <footer>Made by <strong>DoItFastIT</strong> · Visit: <a href="https://doitfastit.com" target="_blank" rel="noopener">doitfastit.com ↗</a></footer>

  <script>
    (function() {
      // ─── CONSTANTS & CONFIG ───────────────────────────────
      const WEBHOOK_URL = 'https://n8n.gonoshastho.de/webhook/google-forms';
      const REFERRAL_WEBHOOK = 'https://n8n.gonoshastho.de/webhook/Person-name';

      let referrals = [];

      const form = document.getElementById('billingForm');
      const submitBtn = document.getElementById('submitBtn');
      const feedback = document.getElementById('feedback');
      const referSelect = document.getElementById('refer');

      function populateReferralSelect() {
        const currentValue = referSelect.value;
        referSelect.innerHTML = '';

        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = '-- Select Referral --';
        placeholder.disabled = true;
        placeholder.selected = true;
        referSelect.appendChild(placeholder);

        referrals.forEach(name => {
          const option = document.createElement('option');
          option.value = name;
          option.textContent = name;
          referSelect.appendChild(option);
        });

        if (currentValue && referrals.includes(currentValue)) {
          referSelect.value = currentValue;
        }
      }

      async function loadReferralNames() {
        referSelect.disabled = true;
        referSelect.innerHTML = '<option>Loading referrals...</option>';

        try {
          const res = await fetch(REFERRAL_WEBHOOK, {
            method: 'GET',
            headers: { 'Accept': 'application/json' }
          });

          if (!res.ok) throw new Error(`HTTP ${res.status}`);

          const data = await res.json();

          referrals = Array.isArray(data)
            ? data.map(i => i['Referral Person']).filter(Boolean)
            : [];

          populateReferralSelect();
        } catch (err) {
          console.error('Referral loading failed:', err);
          referSelect.innerHTML = '<option value="">Unable to load referrals</option>';
        } finally {
          referSelect.disabled = false;
        }
      }

      document.getElementById('billDate').valueAsDate = new Date();
      loadReferralNames();

      // ─── FEEDBACK / VALIDATION / SUBMIT ─────────────────
      function showFeedback(type, message) {
        feedback.className = `show ${type}`;
        feedback.innerHTML = type === 'success'
          ? `<svg width="18" height="18" fill="none" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" stroke="#00856F" stroke-width="1.6"/><path d="M5.5 9l2.5 2.5 4.5-5" stroke="#00856F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>${message}`
          : `<svg width="18" height="18" fill="none" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" stroke="#E53E3E" stroke-width="1.6"/><path d="M9 5v5m0 2.5v.5" stroke="#E53E3E" stroke-width="1.6" stroke-linecap="round"/></svg>${message}`;
        feedback.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      function setLoading(on) {
        submitBtn.disabled = on;
        submitBtn.classList.toggle('loading', on);
      }

      function validateForm() {
        let valid = true;
        form.querySelectorAll('[required]').forEach(el => {
          el.classList.remove('error');
          if (!el.value.trim()) {
            el.classList.add('error');
            valid = false;
          }
        });
        
        if (referSelect.value === '') {
          referSelect.classList.add('error');
          valid = false;
        } else {
          referSelect.classList.remove('error');
        }
        return valid;
      }

      function resetForm() {
        form.reset();
        document.getElementById('billDate').valueAsDate = new Date();
        referSelect.value = '';
        feedback.className = '';
        form.querySelectorAll('.error').forEach(el => el.classList.remove('error'));
        referSelect.classList.remove('error');
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        feedback.className = '';

        if (!validateForm()) {
          showFeedback('fail', 'Please fill in all required fields and select a referral name.');
          return;
        }

        const payload = {
          patientName:    document.getElementById('patientName').value.trim(),
          payment:        document.getElementById('payment').value.trim(),
          billAmount:     document.getElementById('billAmount').value.trim(),
          billDate:       document.getElementById('billDate').value,
          billDue:        document.getElementById('billDue').value.trim(),
          refer:          referSelect.value,
          matchPersonName:document.getElementById('matchPersonName').value.trim(),
          totalMatch:     document.getElementById('totalMatch').value.trim(),
          patientPhone:   document.getElementById('patientPhone').value.trim(),
          location:       document.getElementById('location').value.trim(),
          serial:         document.getElementById('serial').value.trim(),
        };

        setLoading(true);

        try {
          const res = await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          if (res.ok) {
            showFeedback('success', `Record for <strong>${payload.patientName}</strong> saved to Google Sheets successfully!`);
            setTimeout(resetForm, 4000);
          } else {
            const txt = await res.text().catch(() => '');
            showFeedback('fail', `Server responded with ${res.status}. ${txt || 'Please check the n8n workflow.'}`);
          }
        } catch (err) {
          showFeedback('fail', `Network error: ${err.message}. Check your connection or the webhook URL.`);
        } finally {
          setLoading(false);
        }
      });

      form.querySelectorAll('input, select').forEach(el => {
        el.addEventListener('input', () => el.classList.remove('error'));
        el.addEventListener('change', () => el.classList.remove('error'));
      });

      window.resetForm = resetForm;
    })();
  </script>
</body>
</html>
