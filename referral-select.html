<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Billing - Select Referral Person</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;600;700&display=swap');

        :root {
            --bg: #F0F4FF;
            --surface: #FFFFFF;
            --primary: #2C5BF0;
            --primary-dk: #1A3FBF;
            --accent: #00C2A0;
            --text: #1A1D2E;
            --muted: #6B7280;
            --border: #D8DEFF;
            --error: #E53E3E;
            --success: #00C2A0;
            --shadow: 0 4px 24px rgba(44, 91, 240, .10);
            --radius: 14px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px 60px;
        }

        /* ── Header ── */
        .page-header {
            text-align: center;
            margin-bottom: 36px;
            max-width: 600px;
        }

        .page-header .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(44, 91, 240, .10);
            color: var(--primary);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .page-header h1 {
            font-family: 'Sora', sans-serif;
            font-size: clamp(26px, 5vw, 40px);
            font-weight: 700;
            color: var(--text);
        }

        .page-header p {
            margin-top: 10px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
        }

        /* ── Card ── */
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 760px;
            padding: 40px 44px;
            border: 1px solid var(--border);
        }

        .section-label {
            font-family: 'Sora', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--primary);
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
            margin: 32px 0 20px;
        }

        .section-label:first-of-type {
            margin-top: 0;
        }

        .field-hint {
            font-size: 11.5px;
            color: var(--muted);
            margin-top: 10px;
        }

        /* ── Skeleton ── */
        .referral-skeleton {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .skeleton-item {
            height: 54px;
            border-radius: 10px;
            background: linear-gradient(90deg, #e8ecff 25%, #d8deff 50%, #e8ecff 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0
            }

            100% {
                background-position: -200% 0
            }
        }

        /* ── Referral List ── */
        .referral-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .referral-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            background: #FAFBFF;
            cursor: pointer;
            transition: border-color .18s, background .18s, box-shadow .18s, transform .12s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .referral-item:hover {
            border-color: var(--primary);
            background: rgba(44, 91, 240, .04);
            box-shadow: 0 2px 12px rgba(44, 91, 240, .10);
        }

        .referral-item:active {
            transform: scale(0.985);
        }

        .referral-item.selected {
            border-color: var(--primary);
            background: rgba(44, 91, 240, .08);
            box-shadow: 0 0 0 3px rgba(44, 91, 240, .12);
        }

        .referral-item.disabled {
            opacity: .5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .referral-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(44, 91, 240, .12);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 15px;
            flex-shrink: 0;
            transition: background .18s, color .18s;
        }

        .referral-item.selected .referral-avatar {
            background: var(--primary);
            color: #fff;
        }

        .referral-name {
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
            flex: 1;
        }

        .referral-check {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1.5px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: border-color .18s, background .18s;
        }

        .referral-item.selected .referral-check {
            border-color: var(--primary);
            background: var(--primary);
        }

        .referral-check svg {
            display: none;
        }

        .referral-item.selected .referral-check svg {
            display: block;
        }

        /* ── Loading overlay for submit ── */
        .submit-loading {
            display: none;
            align-items: center;
            gap: 10px;
            margin-top: 18px;
            padding: 13px 18px;
            background: rgba(44, 91, 240, .07);
            border: 1.5px solid rgba(44, 91, 240, .20);
            border-radius: 9px;
            font-size: 14px;
            font-weight: 500;
            color: var(--primary);
        }

        .submit-loading.visible {
            display: flex;
        }

        .spin {
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(44, 91, 240, .3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin .7s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        /* ── Messages ── */
        .list-message {
            padding: 24px 20px;
            text-align: center;
            border-radius: 10px;
            font-size: 14px;
            color: var(--muted);
        }

        .list-message.error {
            background: rgba(229, 62, 62, .06);
            color: var(--error);
            border: 1.5px solid rgba(229, 62, 62, .18);
        }

        /* ── Screen transitions ── */
        #selectionScreen,
        #resultsScreen {
            width: 100%;
            max-width: 760px;
            transition: opacity .3s ease, transform .3s ease;
        }

        #selectionScreen.hidden,
        #resultsScreen.hidden {
            display: none;
        }

        /* ── Results screen ── */
        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }

        .results-title {
            font-family: 'Sora', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
        }

        .results-meta {
            font-size: 13px;
            color: var(--muted);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: transparent;
            border: 1.5px solid var(--border);
            border-radius: 9px;
            padding: 9px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            transition: border-color .18s, color .18s;
        }

        .back-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* ── Patient cards ── */
        .patient-cards {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .patient-card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .patient-card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px 24px 16px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, rgba(44, 91, 240, .04) 0%, rgba(44, 91, 240, .01) 100%);
        }

        .patient-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 18px;
            flex-shrink: 0;
        }

        .patient-title-wrap {
            flex: 1;
            min-width: 0;
        }

        .patient-name {
            font-family: 'Sora', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .patient-meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 5px;
        }

        .patient-meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--muted);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2px 10px;
        }

        .patient-meta-pill svg {
            opacity: .6;
        }

        /* Finance strip */
        .finance-strip {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0;
            border-bottom: 1px solid var(--border);
        }

        .finance-cell {
            padding: 14px 18px;
            border-right: 1px solid var(--border);
        }

        .finance-cell:last-child {
            border-right: none;
        }

        .finance-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .finance-value {
            font-family: 'Sora', sans-serif;
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
        }

        .finance-value.highlight {
            color: var(--primary);
        }

        .finance-value.commission {
            color: #00856F;
        }

        /* Details grid */
        .patient-details {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0;
            padding: 0;
        }

        .detail-cell {
            padding: 14px 18px;
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .detail-cell:nth-child(3n) {
            border-right: none;
        }

        .detail-cell:nth-last-child(-n+3) {
            border-bottom: none;
        }

        .detail-label {
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: .05em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 3px;
        }

        .detail-value {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            word-break: break-word;
        }

        .detail-value.empty {
            color: var(--muted);
            font-style: italic;
            font-weight: 400;
        }

        /* Summary bar */
        .results-summary {
            padding: 16px 20px;
            background: rgba(44, 91, 240, .05);
            border: 1.5px solid rgba(44, 91, 240, .15);
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .summary-name {
            font-family: 'Sora', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
        }

        .summary-count {
            font-size: 13px;
            color: var(--muted);
        }

        /* Retry button */
        .retry-btn {
            margin-top: 12px;
            padding: 10px 20px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            transition: background .18s;
        }

        .retry-btn:hover {
            background: var(--primary-dk);
        }

        footer {
            margin-top: 32px;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
        }

        @media(max-width:640px) {

            .card,
            .patient-card-header,
            .finance-strip,
            .patient-details {
                padding-left: 16px;
                padding-right: 16px
            }

            .finance-strip {
                grid-template-columns: 1fr 1fr;
            }

            .finance-cell:nth-child(2) {
                border-right: none;
            }

            .finance-cell:nth-child(1),
            .finance-cell:nth-child(2) {
                border-bottom: 1px solid var(--border);
            }

            .patient-details {
                grid-template-columns: 1fr 1fr;
            }

            .detail-cell:nth-child(3n) {
                border-right: 1px solid var(--border);
            }

            .detail-cell:nth-child(2n) {
                border-right: none;
            }

            .card {
                padding: 28px 20px;
            }
        }

        @media(max-width:420px) {

            .finance-strip,
            .patient-details {
                grid-template-columns: 1fr;
            }

            .finance-cell,
            .detail-cell {
                border-right: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- ══ PAGE HEADER ══════════════════════════════════════════ -->
    <header class="page-header">
        <div class="badge">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.5" />
                <path d="M6 3.5V6.5L7.5 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            Patient Billing System
        </div>
        <h1 id="pageTitle">Select Referral Person</h1>
        <p id="pageSubtitle">Tap a name below to choose your referral contact. Results load automatically.</p>
    </header>

    <!-- ══ SELECTION SCREEN ══════════════════════════════════════ -->
    <div id="selectionScreen">
        <div class="card">
            <div class="section-label">Referral Person</div>

            <div id="referralListContainer">
                <div class="referral-skeleton" id="skeletonLoader">
                    <div class="skeleton-item"></div>
                    <div class="skeleton-item"></div>
                    <div class="skeleton-item"></div>
                    <div class="skeleton-item"></div>
                </div>
            </div>

            <!-- Loading indicator while POST is in flight -->
            <div class="submit-loading" id="submitLoading">
                <div class="spin"></div>
                <span id="submitLoadingText">Loading records…</span>
            </div>

            <div class="field-hint" id="listHint">Referral names are loaded automatically from the server.</div>
        </div>
    </div>

    <!-- ══ RESULTS SCREEN ════════════════════════════════════════ -->
    <div id="resultsScreen" class="hidden">
        <div class="results-header">
            <div>
                <div class="results-title" id="resultsTitle">Patient Records</div>
                <div class="results-meta" id="resultsMeta"></div>
            </div>
            <button class="back-btn" id="backBtn">
                <svg width="14" height="14" fill="none" viewBox="0 0 14 14">
                    <path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                Change Person
            </button>
        </div>

        <div class="results-summary" id="resultsSummary"></div>
        <div class="patient-cards" id="patientCards"></div>
    </div>

    <footer>Made by <strong>DoItFastIT</strong> &middot; Visit: <a href="https://doitfastit.com" target="_blank"
            rel="noopener">doitfastit.com &nearr;</a></footer>

    <script>
        (function () {
            var VIEW_DATA_URL = 'https://n8n.gonoshastho.de/webhook/view-data';
            var SUBMIT_URL = 'https://n8n.gonoshastho.de/webhook/reffer-call';

            /* DOM refs */
            var selectionScreen = document.getElementById('selectionScreen');
            var resultsScreen = document.getElementById('resultsScreen');
            var referralListContainer = document.getElementById('referralListContainer');
            var skeletonLoader = document.getElementById('skeletonLoader');
            var submitLoading = document.getElementById('submitLoading');
            var submitLoadingText = document.getElementById('submitLoadingText');
            var listHint = document.getElementById('listHint');
            var backBtn = document.getElementById('backBtn');
            var resultsTitle = document.getElementById('resultsTitle');
            var resultsMeta = document.getElementById('resultsMeta');
            var resultsSummary = document.getElementById('resultsSummary');
            var patientCards = document.getElementById('patientCards');
            var pageTitle = document.getElementById('pageTitle');

            var isSubmitting = false;

            /* ── Utilities ───────────────────────────────────────────── */
            function esc(s) {
                return String(s).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }
            function initials(name) {
                return String(name).split(' ').map(function (w) { return w[0] || ''; }).slice(0, 2).join('').toUpperCase();
            }
            function fmtMoney(v) {
                var n = parseFloat(v);
                if (isNaN(n)) return esc(v);
                return n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
            }
            function fmtPct(v) {
                var n = parseFloat(v);
                if (isNaN(n)) return esc(v);
                return Math.round(n * 100) + '%';
            }
            function fmtDate(v) {
                if (!v) return '—';
                var d = new Date(v);
                if (isNaN(d.getTime())) return esc(v);
                return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            }
            function fmtMonth(v) {
                if (!v) return '—';
                var parts = String(v).split('-');
                if (parts.length < 2) return esc(v);
                var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                return months[parseInt(parts[1], 10) - 1] + ' ' + parts[0];
            }
            function orDash(v) { return (v !== null && v !== undefined && String(v).trim() !== '') ? esc(v) : '—'; }
            function orEmpty(v) { return (v !== null && v !== undefined && String(v).trim() !== '') ? String(v).trim() : ''; }

            /* ── Selection screen ────────────────────────────────────── */
            function setListDisabled(disabled) {
                document.querySelectorAll('.referral-item').forEach(function (el) {
                    el.classList.toggle('disabled', disabled);
                });
            }

            function selectItem(name, clickedEl) {
                if (isSubmitting) return;
                /* visual selection */
                document.querySelectorAll('.referral-item').forEach(function (el) {
                    el.classList.remove('selected');
                    el.setAttribute('aria-pressed', 'false');
                });
                clickedEl.classList.add('selected');
                clickedEl.setAttribute('aria-pressed', 'true');

                submitRecord(name);
            }

            function createItem(name) {
                var item = document.createElement('div');
                item.className = 'referral-item';
                item.setAttribute('role', 'button');
                item.setAttribute('tabindex', '0');
                item.setAttribute('aria-pressed', 'false');
                item.dataset.name = name;
                item.innerHTML =
                    '<div class="referral-avatar">' + initials(name) + '</div>' +
                    '<span class="referral-name">' + esc(name) + '</span>' +
                    '<div class="referral-check">' +
                    '<svg width="11" height="9" viewBox="0 0 11 9" fill="none">' +
                    '<path d="M1 4.5L4 7.5L10 1" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' +
                    '</svg>' +
                    '</div>';
                item.addEventListener('click', function () { selectItem(name, item); });
                item.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectItem(name, item); }
                });
                return item;
            }

            function renderList(names) {
                if (skeletonLoader && skeletonLoader.parentNode) skeletonLoader.remove();
                if (names.length === 0) {
                    referralListContainer.innerHTML = '<div class="list-message">No referral persons found.</div>';
                    return;
                }
                var list = document.createElement('div');
                list.className = 'referral-list';
                list.id = 'referralList';
                names.forEach(function (n) { list.appendChild(createItem(n)); });
                referralListContainer.appendChild(list);
                listHint.textContent = names.length + ' referral person' + (names.length !== 1 ? 's' : '') + ' available. Tap one to view records.';
            }

            function renderListError(msg) {
                if (skeletonLoader && skeletonLoader.parentNode) skeletonLoader.remove();
                referralListContainer.innerHTML =
                    '<div class="list-message error">' +
                    '<svg width="16" height="16" fill="none" viewBox="0 0 18 18" style="vertical-align:middle;margin-right:6px">' +
                    '<circle cx="9" cy="9" r="8" stroke="#E53E3E" stroke-width="1.6"/>' +
                    '<path d="M9 5v5m0 2.5v.5" stroke="#E53E3E" stroke-width="1.6" stroke-linecap="round"/>' +
                    '</svg>Unable to load referral persons. ' + esc(msg) +
                    '</div>';
                listHint.textContent = 'Please refresh the page or check your connection.';
            }

            /* ── Submit ──────────────────────────────────────────────── */
            function submitRecord(name) {
                if (isSubmitting) return;
                isSubmitting = true;
                setListDisabled(true);
                submitLoadingText.textContent = 'Loading records for "' + name + '"…';
                submitLoading.classList.add('visible');
                listHint.textContent = 'Fetching patient records…';

                fetch(SUBMIT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ 'Referral Person': name })
                })
                    .then(function (res) {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(function (data) {
                        submitLoading.classList.remove('visible');
                        isSubmitting = false;
                        setListDisabled(false);
                        showResults(name, Array.isArray(data) ? data : []);
                    })
                    .catch(function (err) {
                        console.error('Submit failed:', err);
                        submitLoading.classList.remove('visible');
                        isSubmitting = false;
                        setListDisabled(false);
                        showSubmitError(name, err.message);
                    });
            }

            function showSubmitError(name, msg) {
                listHint.innerHTML =
                    '<span style="color:var(--error)">' +
                    '<svg width="13" height="13" fill="none" viewBox="0 0 18 18" style="vertical-align:middle;margin-right:4px">' +
                    '<circle cx="9" cy="9" r="8" stroke="#E53E3E" stroke-width="1.6"/>' +
                    '<path d="M9 5v5m0 2.5v.5" stroke="#E53E3E" stroke-width="1.6" stroke-linecap="round"/>' +
                    '</svg>Failed to load records: ' + esc(msg) + '. ' +
                    '</span>' +
                    '<button class="retry-btn" id="retryBtn" style="margin-top:8px">Retry</button>';
                document.getElementById('retryBtn').addEventListener('click', function () {
                    listHint.textContent = 'Fetching patient records…';
                    /* re-select the item */
                    var sel = document.querySelector('.referral-item.selected');
                    if (sel) submitRecord(sel.dataset.name);
                });
            }

            /* ── Results screen ──────────────────────────────────────── */
            function showResults(name, records) {
                selectionScreen.classList.add('hidden');
                resultsScreen.classList.remove('hidden');

                pageTitle.textContent = 'Patient Records';
                resultsTitle.textContent = 'Records for ' + name;
                resultsMeta.textContent = records.length + ' patient' + (records.length !== 1 ? 's' : '') + ' found';

                /* Summary bar */
                if (records.length > 0) {
                    var totalComm = records.reduce(function (s, r) { return s + (parseFloat(r['Referral Commission']) || 0); }, 0);
                    var totalBiz = records.reduce(function (s, r) { return s + (parseFloat(r['Total Business Amount']) || 0); }, 0);
                    resultsSummary.innerHTML =
                        '<div>' +
                        '<div style="font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px">Referral Person</div>' +
                        '<div class="summary-name">' + esc(name) + '</div>' +
                        '</div>' +
                        '<div style="display:flex;gap:24px;flex-wrap:wrap">' +
                        '<div>' +
                        '<div style="font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px">Total Commission</div>' +
                        '<div style="font-family:Sora,sans-serif;font-size:17px;font-weight:700;color:#00856F">' + fmtMoney(totalComm) + '</div>' +
                        '</div>' +
                        '<div>' +
                        '<div style="font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px">Total Business</div>' +
                        '<div style="font-family:Sora,sans-serif;font-size:17px;font-weight:700;color:var(--primary)">' + fmtMoney(totalBiz) + '</div>' +
                        '</div>' +
                        '<div>' +
                        '<div style="font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px">Patients</div>' +
                        '<div style="font-family:Sora,sans-serif;font-size:17px;font-weight:700;color:var(--text)">' + records.length + '</div>' +
                        '</div>' +
                        '</div>';
                    resultsSummary.style.display = '';
                } else {
                    resultsSummary.style.display = 'none';
                }

                /* Cards */
                patientCards.innerHTML = '';
                if (records.length === 0) {
                    patientCards.innerHTML =
                        '<div class="list-message" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px 20px;text-align:center">' +
                        '<svg width="40" height="40" fill="none" viewBox="0 0 40 40" style="margin:0 auto 12px;display:block">' +
                        '<circle cx="20" cy="20" r="18" stroke="#D8DEFF" stroke-width="2"/>' +
                        '<path d="M13 20h14M20 13v14" stroke="#D8DEFF" stroke-width="2" stroke-linecap="round"/>' +
                        '</svg>' +
                        '<div style="font-family:Sora,sans-serif;font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px">No Records Found</div>' +
                        '<div style="color:var(--muted);font-size:14px">No patient records found for this referral person.</div>' +
                        '</div>';
                    return;
                }

                records.forEach(function (r) { patientCards.appendChild(buildCard(r)); });
            }

            function buildCard(r) {
                var card = document.createElement('div');
                card.className = 'patient-card';

                var pName = orEmpty(r['Patient Name']) || 'Unknown Patient';
                var serial = orEmpty(r['Serial']);
                var location = orEmpty(r['Location']);
                var phone = orEmpty(r['Patient Phone Number']);
                var date = orEmpty(r['Bill Received Date']);
                var month = orEmpty(r['Month']);

                var payment = r['Payment'];
                var billAmt = r['Bill Received Amount'];
                var bizAmt = r['Total Business Amount'];
                var commission = r['Referral Commission'];

                var pct = r['Referral Percentage'];
                var totalMatch = r['Total Match'];
                var matchName = orEmpty(r['Match Person Name']);

                /* Header */
                var metaPills = '';
                if (serial) metaPills += pill(iconPin(), 'Serial #' + esc(serial));
                if (location) metaPills += pill(iconLoc(), esc(location));
                if (month) metaPills += pill(iconCal(), fmtMonth(month));

                card.innerHTML =
                    '<div class="patient-card-header">' +
                    '<div class="patient-avatar">' + initials(pName) + '</div>' +
                    '<div class="patient-title-wrap">' +
                    '<div class="patient-name">' + esc(pName) + '</div>' +
                    '<div class="patient-meta-row">' + metaPills + '</div>' +
                    '</div>' +
                    '</div>' +

                    /* Finance strip */
                    '<div class="finance-strip">' +
                    finCell('Payment', 'highlight', fmtMoney(payment)) +
                    finCell('Bill Amount', '', fmtMoney(billAmt)) +
                    finCell('Business Amount', 'highlight', fmtMoney(bizAmt)) +
                    finCell('Commission', 'commission', fmtMoney(commission)) +
                    '</div>' +

                    /* Details grid */
                    '<div class="patient-details">' +
                    detCell('Bill Date', fmtDate(date)) +
                    detCell('Phone', phone ? '<a href="tel:' + esc(phone) + '" style="color:var(--primary);text-decoration:none">' + esc(phone) + '</a>' : '<span class="detail-value empty">—</span>', true) +
                    detCell('Month', fmtMonth(month)) +
                    detCell('Ref. %', fmtPct(pct)) +
                    detCell('Total Match', orDash(totalMatch)) +
                    detCell('Match Person', matchName || '<span class="detail-value empty">No matched person</span>', true) +
                    '</div>';

                return card;
            }

            /* ── Card helpers ────────────────────────────────────────── */
            function pill(icon, text) {
                return '<span class="patient-meta-pill">' + icon + text + '</span>';
            }
            function finCell(label, cls, value) {
                return '<div class="finance-cell"><div class="finance-label">' + label + '</div>' +
                    '<div class="finance-value ' + cls + '">' + value + '</div></div>';
            }
            function detCell(label, value, raw) {
                var v = raw ? value : '<span class="detail-value">' + value + '</span>';
                return '<div class="detail-cell"><div class="detail-label">' + label + '</div>' + v + '</div>';
            }
            function iconPin() { return '<svg width="10" height="10" fill="none" viewBox="0 0 12 12"><circle cx="6" cy="5" r="2.5" stroke="currentColor" stroke-width="1.3"/><path d="M6 9C6 9 2 6.5 2 4.5a4 4 0 018 0C10 6.5 6 9 6 9z" stroke="currentColor" stroke-width="1.3"/></svg>'; }
            function iconLoc() { return '<svg width="10" height="10" fill="none" viewBox="0 0 12 12"><path d="M6 1a3.5 3.5 0 00-3.5 3.5C2.5 7.5 6 11 6 11S9.5 7.5 9.5 4.5A3.5 3.5 0 006 1z" stroke="currentColor" stroke-width="1.3"/><circle cx="6" cy="4.5" r="1.2" stroke="currentColor" stroke-width="1.1"/></svg>'; }
            function iconCal() { return '<svg width="10" height="10" fill="none" viewBox="0 0 12 12"><rect x="1" y="2" width="10" height="9" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M1 5h10M4 1v2M8 1v2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>'; }

            /* ── Back button ─────────────────────────────────────────── */
            backBtn.addEventListener('click', function () {
                resultsScreen.classList.add('hidden');
                selectionScreen.classList.remove('hidden');
                pageTitle.textContent = 'Select Referral Person';
                /* deselect all */
                document.querySelectorAll('.referral-item').forEach(function (el) {
                    el.classList.remove('selected');
                    el.setAttribute('aria-pressed', 'false');
                });
                listHint.textContent = 'Tap a name to view their patient records.';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            /* ── Load referral names ─────────────────────────────────── */
            fetch(VIEW_DATA_URL, { method: 'GET', headers: { 'Accept': 'application/json' } })
                .then(function (res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function (data) {
                    var names = Array.isArray(data)
                        ? data.map(function (i) { return i['Referral Person']; }).filter(Boolean)
                        : [];
                    renderList(names);
                })
                .catch(function (err) {
                    console.error('Failed to load referral persons:', err);
                    renderListError(err.message);
                });
        })();
    </script>
</body>

</html>
